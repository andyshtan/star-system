<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematical Resonance</title>
    <style>
        body {
            margin: 0;
            background-color: #03010a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* Elegant, deep background gradient */
            background-image: 
                radial-gradient(circle at 50% 40%, #0d0626 0%, #03010a 60%, #000 100%);
        }
        
        #scene-container {
            position: relative;
            width: 100vmin;
            height: 100vmin;
            perspective: 1500px;
        }
        
        /* A subtle glowing ambient core behind the math */
        #core-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 45vmin;
            height: 45vmin;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(90, 40, 255, 0.15) 0%, rgba(0,0,0,0) 70%);
            filter: blur(25px);
            pointer-events: none;
        }

        svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px rgba(120, 80, 255, 0.2));
            transform-style: preserve-3d;
            animation: breathe 240s infinite alternate ease-in-out;
        }
        
        @keyframes breathe {
            0% { transform: scale(0.95) rotateX(12deg) rotateY(-12deg); }
            100% { transform: scale(1.05) rotateX(-12deg) rotateY(12deg); }
        }
    </style>
</head>
<body>
    <div id="scene-container">
        <div id="core-glow"></div>
        <svg id="canvas" viewBox="-500 -500 1000 1000"></svg>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const numRoses = 32; // Increased complexity
        const paths = [];

        // Initialize SVG paths
        for(let i=0; i<numRoses; i++) {
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("fill", "none");
            
            // Outer rings thinner, inner rings slightly thicker
            const strokeW = 0.3 + (1 - i / numRoses) * 1.5; 
            path.setAttribute("stroke-width", strokeW.toString());
            
            // Color-dodge creates blown-out, glowing neon intersections
            path.setAttribute("style", "mix-blend-mode: color-dodge; stroke-linecap: round;");
            
            canvas.appendChild(path);
            paths.push(path);
        }

        // We separate morph speed (glacial) from color speed (active shimmering)
        let morphTime = 0;
        let colorTime = 0;

        function animate() {
            morphTime += 0.00001; // Glacial shape morphing
            colorTime += 0.0005;  // Subtle, continuous color shifting

            for(let p=0; p<numRoses; p++) {
                const layerOffset = p * 0.035;
                const t = morphTime + layerOffset;
                
                // Maurer Rose equation
                const n = Math.sin(t * 0.8) * 5 + 7;
                const d = Math.cos(t * 0.5) * 15 + 29;
                
                const scale = 460 - p * 13; 
                let dStr = "";
                
                for (let i = 0; i <= 360; i += 1) { 
                    const k = i * d * Math.PI / 180;
                    const r = scale * Math.sin(n * k);
                    
                    const baseX = r * Math.cos(k);
                    const baseY = r * Math.sin(k);
                    
                    const rot = t * 1.5;
                    const x = baseX * Math.cos(rot) - baseY * Math.sin(rot);
                    const y = baseX * Math.sin(rot) + baseY * Math.cos(rot);
                    
                    if (i === 0) dStr += `M ${x.toFixed(2)} ${y.toFixed(2)} `;
                    else dStr += `L ${x.toFixed(2)} ${y.toFixed(2)} `;
                }
                
                paths[p].setAttribute("d", dStr);
                
                // Sophisticated Aurora / Bioluminescent Palette
                // Shifts smoothly between Cyan (180), Deep Blue (240), and Magenta (320)
                const hueOscillator = Math.sin(colorTime + p * 0.1); 
                const hue = 250 + hueOscillator * 70; 
                
                // Depth dynamics: inner rings are brighter and more opaque
                const depthRatio = 1 - (p / numRoses); 
                const lightness = 40 + depthRatio * 25 + Math.sin(colorTime * 4 + p) * 10;
                const opacity = 0.15 + depthRatio * 0.45;
                
                paths[p].setAttribute("stroke", `hsla(${hue}, 95%, ${lightness}%, ${opacity})`);
            }
            
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
