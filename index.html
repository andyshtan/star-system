<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematical Resonance</title>
    <style>
        body {
            margin: 0;
            background-color: #03010a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-image: radial-gradient(circle at 50% 40%, #09041a 0%, #020108 70%, #000 100%);
        }
        
        /* Ambient deep space stardust layer */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.7;
        }

        /* Subtle cinematic film grain overlay */
        #grain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.06'/%3E%3C/svg%3E");
        }
        
        #scene-container {
            position: relative;
            width: 100vmin;
            height: 100vmin;
            perspective: 1500px;
            z-index: 2; /* Sits between stardust and film grain */
        }
        
        #core-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 45vmin;
            height: 45vmin;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(90, 40, 255, 0.15) 0%, rgba(0,0,0,0) 70%);
            filter: blur(25px);
            pointer-events: none;
        }

        svg#canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px rgba(120, 80, 255, 0.2));
            transform-style: preserve-3d;
            animation: breathe 240s infinite alternate ease-in-out;
        }
        
        @keyframes breathe {
            0% { transform: scale(0.95) rotateX(12deg) rotateY(-12deg); }
            100% { transform: scale(1.05) rotateX(-12deg) rotateY(12deg); }
        }
    </style>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    
    <div id="scene-container">
        <div id="core-glow"></div>
        <svg id="canvas" viewBox="-500 -500 1000 1000"></svg>
    </div>
    
    <!-- Grain overlay on top of everything -->
    <div id="grain"></div>

    <script>
        // --- BACKGROUND STARDUST ENGINE ---
        const bgCanvas = document.getElementById('bg-canvas');
        const bgCtx = bgCanvas.getContext('2d');
        
        let width, height;
        const particles = [];
        
        function resizeCanvas() {
            width = window.innerWidth;
            height = window.innerHeight;
            bgCanvas.width = width;
            bgCanvas.height = height;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Create 150 slow-moving, pulsing particles
        for(let i=0; i<150; i++) {
            particles.push({
                x: Math.random() * width,
                y: Math.random() * height,
                radius: Math.random() * 1.5 + 0.2, // Tiny specs
                speedX: (Math.random() - 0.5) * 0.1, // Ultra slow drift
                speedY: (Math.random() - 0.5) * 0.1,
                baseOpacity: Math.random() * 0.4 + 0.1,
                pulseSpeed: Math.random() * 0.01 + 0.005,
                pulsePhase: Math.random() * Math.PI * 2
            });
        }

        function animateBackground() {
            bgCtx.clearRect(0, 0, width, height);
            
            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;
                
                // Wrap around edges seamlessly
                if(p.x < 0) p.x = width;
                if(p.x > width) p.x = 0;
                if(p.y < 0) p.y = height;
                if(p.y > height) p.y = 0;
                
                // Slowly pulse the opacity
                p.pulsePhase += p.pulseSpeed;
                const currentOpacity = p.baseOpacity + Math.sin(p.pulsePhase) * 0.2;
                
                bgCtx.beginPath();
                bgCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                bgCtx.fillStyle = `rgba(160, 200, 255, ${Math.max(0.02, currentOpacity)})`;
                bgCtx.fill();
            });
        }

        // --- FOREGROUND MATH ENGINE ---
        const canvasSvg = document.getElementById('canvas');
        const numRoses = 32;
        const paths = [];

        for(let i=0; i<numRoses; i++) {
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("fill", "none");
            const strokeW = 0.3 + (1 - i / numRoses) * 1.5; 
            path.setAttribute("stroke-width", strokeW.toString());
            path.setAttribute("style", "mix-blend-mode: color-dodge; stroke-linecap: round;");
            canvasSvg.appendChild(path);
            paths.push(path);
        }

        let morphTime = 0;
        let colorTime = 0;

        function animate() {
            // Update both engines
            animateBackground();

            morphTime += 0.00001; 
            colorTime += 0.0005;  

            for(let p=0; p<numRoses; p++) {
                const layerOffset = p * 0.035;
                const t = morphTime + layerOffset;
                
                const n = Math.sin(t * 0.8) * 5 + 7;
                const d = Math.cos(t * 0.5) * 15 + 29;
                
                const scale = 460 - p * 13; 
                let dStr = "";
                
                for (let i = 0; i <= 360; i += 1) { 
                    const k = i * d * Math.PI / 180;
                    const r = scale * Math.sin(n * k);
                    
                    const baseX = r * Math.cos(k);
                    const baseY = r * Math.sin(k);
                    
                    const rot = t * 1.5;
                    const x = baseX * Math.cos(rot) - baseY * Math.sin(rot);
                    const y = baseX * Math.sin(rot) + baseY * Math.cos(rot);
                    
                    if (i === 0) dStr += `M ${x.toFixed(2)} ${y.toFixed(2)} `;
                    else dStr += `L ${x.toFixed(2)} ${y.toFixed(2)} `;
                }
                
                paths[p].setAttribute("d", dStr);
                
                const hueOscillator = Math.sin(colorTime + p * 0.1); 
                const hue = 250 + hueOscillator * 70; 
                
                const depthRatio = 1 - (p / numRoses); 
                const lightness = 40 + depthRatio * 25 + Math.sin(colorTime * 4 + p) * 10;
                const opacity = 0.15 + depthRatio * 0.45;
                
                paths[p].setAttribute("stroke", `hsla(${hue}, 95%, ${lightness}%, ${opacity})`);
            }
            
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
