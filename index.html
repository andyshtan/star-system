<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematical Resonance</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='none' stroke='%238888ff' stroke-width='8'/></svg>">
    <style>
        /* --- GLOBAL STYLES --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000; /* Pure deep black */
        }

        #tan-app, #cool-app {
            display: none; /* Hidden by default, JS will reveal one */
            width: 100%;
            height: 100%;
            background-color: #000000;
        }

        /* --- TAN.ID STYLES (MAURER ROSE) --- */
        #tan-app {
            justify-content: center;
            align-items: center;
        }
        #scene-container {
            position: relative;
            width: 100vmin;
            height: 100vmin;
            perspective: 1500px;
            z-index: 2;
        }
        #core-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 45vmin;
            height: 45vmin;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(90, 40, 255, 0.15) 0%, rgba(0,0,0,0) 70%);
            filter: blur(25px);
            pointer-events: none;
        }
        svg#tan-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 20px rgba(120, 80, 255, 0.2));
            transform-style: preserve-3d;
            animation: breathe 240s infinite alternate ease-in-out;
        }
        @keyframes breathe {
            0% { transform: scale(0.95) rotateX(12deg) rotateY(-12deg); }
            100% { transform: scale(1.05) rotateX(-12deg) rotateY(12deg); }
        }

        /* --- COOL.ID STYLES (SUN & PLANETS) --- */
        #cool-app {
            justify-content: center;
            align-items: center;
        }
        #cool-app svg {
            width: 90vmin;
            height: 90vmin;
        }
        .orbit {
            fill: none;
            stroke: rgba(255, 255, 255, 0.2);
            stroke-width: 1;
            stroke-dasharray: 4 4;
        }
        .sun {
            filter: drop-shadow(0 0 30px #FF8C00);
        }
        .planet {
            animation: orbit linear infinite;
        }
        @keyframes orbit {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        .p1 { animation-duration: 4s; }
        .p2 { animation-duration: 7s; }
        .p3 { animation-duration: 12s; }
        .p4 { animation-duration: 20s; }
    </style>
</head>
<body>

    <!-- TAN.ID: MAURER ROSE -->
    <div id="tan-app">
        <div id="scene-container">
            <div id="core-glow"></div>
            <svg id="tan-canvas" viewBox="-500 -500 1000 1000"></svg>
        </div>
    </div>

    <!-- COOL.ID: SUN & PLANETS -->
    <div id="cool-app">
        <svg viewBox="0 0 1000 1000">
            <defs>
                <radialGradient id="sun-grad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                    <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
                    <stop offset="20%" style="stop-color:#FFF5A5;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#FFA500;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#FF4500;stop-opacity:0.9" />
                </radialGradient>
                <radialGradient id="p1-grad" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#dddddd"/><stop offset="100%" stop-color="#444444"/>
                </radialGradient>
                <radialGradient id="p2-grad" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#ffcc99"/><stop offset="100%" stop-color="#995522"/>
                </radialGradient>
                <radialGradient id="p3-grad" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#aaddff"/><stop offset="100%" stop-color="#0044aa"/>
                </radialGradient>
                <radialGradient id="p4-grad" cx="30%" cy="30%" r="70%">
                    <stop offset="0%" stop-color="#ff8888"/><stop offset="100%" stop-color="#aa0000"/>
                </radialGradient>
            </defs>

            <!-- Orbits -->
            <circle class="orbit" cx="500" cy="500" r="100" />
            <circle class="orbit" cx="500" cy="500" r="180" />
            <circle class="orbit" cx="500" cy="500" r="280" />
            <circle class="orbit" cx="500" cy="500" r="400" />

            <!-- Sun -->
            <circle class="sun" cx="500" cy="500" r="55" fill="url(#sun-grad)" />

            <!-- Planet 1 -->
            <g class="planet p1" style="transform-origin: 500px 500px;">
                <circle cx="500" cy="400" r="12" fill="url(#p1-grad)" />
            </g>
            
            <!-- Planet 2 -->
            <g class="planet p2" style="transform-origin: 500px 500px;">
                <circle cx="500" cy="320" r="20" fill="url(#p2-grad)" />
                <ellipse cx="500" cy="320" rx="35" ry="10" fill="none" stroke="rgba(255,200,150,0.5)" stroke-width="3" transform="rotate(20 500 320)" />
            </g>

            <!-- Planet 3 -->
            <g class="planet p3" style="transform-origin: 500px 500px;">
                <circle cx="500" cy="220" r="25" fill="url(#p3-grad)" />
                <g style="animation: orbit 2s linear infinite; transform-origin: 500px 220px;">
                    <circle cx="500" cy="175" r="5" fill="#ffffff" />
                </g>
            </g>

            <!-- Planet 4 -->
            <g class="planet p4" style="transform-origin: 500px 500px;">
                <circle cx="500" cy="100" r="18" fill="url(#p4-grad)" />
                <g style="animation: orbit 3s linear infinite; transform-origin: 500px 100px;">
                    <circle cx="500" cy="65" r="3" fill="#dddddd" />
                </g>
                <g style="animation: orbit 5s linear infinite reverse; transform-origin: 500px 100px;">
                    <circle cx="500" cy="50" r="4" fill="#aaaaaa" />
                </g>
            </g>
        </svg>
    </div>

    <script>
        const isCoolId = window.location.hostname.includes('cool.id');

        if (isCoolId) {
            // --- INITIALIZE COOL.ID (SUN & PLANETS) ---
            document.title = "Star System";
            document.getElementById('cool-app').style.display = 'flex';
            document.querySelector("link[rel*='icon']").href = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23FFA500'/></svg>";
        } else {
            // --- INITIALIZE TAN.ID (MAURER ROSE) ---
            document.getElementById('tan-app').style.display = 'flex';
            
            const canvasSvg = document.getElementById('tan-canvas');
            const numShapes = 32; 
            const paths = [];

            for(let i=0; i<numShapes; i++) {
                const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
                path.setAttribute("fill", "none");
                const strokeW = 0.3 + (1 - i / numShapes) * 1.5; 
                path.setAttribute("stroke-width", strokeW.toString());
                path.setAttribute("style", "mix-blend-mode: color-dodge; stroke-linecap: round;");
                canvasSvg.appendChild(path);
                paths.push(path);
            }

            let morphTime = 0;
            let colorTime = 0;

            function animate() {
                morphTime += 0.00001; 
                colorTime += 0.0005;  

                for(let p=0; p<numShapes; p++) {
                    const t = morphTime + p * 0.035;
                    const n = Math.sin(t * 0.8) * 5 + 7;
                    const d = Math.cos(t * 0.5) * 15 + 29;
                    const scale = 460 - p * 13; 
                    
                    let dStr = "";
                    for (let i = 0; i <= 360; i += 1) { 
                        const k = i * d * Math.PI / 180;
                        const r = scale * Math.sin(n * k);
                        const baseX = r * Math.cos(k);
                        const baseY = r * Math.sin(k);
                        const rot = t * 1.5;
                        const x = baseX * Math.cos(rot) - baseY * Math.sin(rot);
                        const y = baseX * Math.sin(rot) + baseY * Math.cos(rot);
                        
                        if (i === 0) dStr += `M ${x.toFixed(2)} ${y.toFixed(2)} `;
                        else dStr += `L ${x.toFixed(2)} ${y.toFixed(2)} `;
                    }
                    
                    const hue = 250 + Math.sin(colorTime + p * 0.1) * 70; 
                    const depthRatio = 1 - (p / numShapes); 
                    const lightness = 40 + depthRatio * 25 + Math.sin(colorTime * 4 + p) * 10;
                    
                    paths[p].setAttribute("d", dStr);
                    paths[p].setAttribute("stroke", `hsla(${hue}, 95%, ${lightness}%, ${0.15 + depthRatio * 0.45})`);
                }
                
                requestAnimationFrame(animate);
            }
            animate();
        }
    </script>
</body>
</html>
