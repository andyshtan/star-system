<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematical Resonance</title>
    <style>
        body {
            margin: 0;
            background-color: #020204;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-image: radial-gradient(circle at center, #0a0a16 0%, #000 100%);
        }
        
        #scene-container {
            position: relative;
            width: 100vmin;
            height: 100vmin;
            perspective: 1200px;
        }

        svg {
            width: 100%;
            height: 100%;
            filter: drop-shadow(0 0 15px rgba(255, 255, 255, 0.1));
            transform-style: preserve-3d;
            animation: breathe 12s infinite alternate ease-in-out;
        }
        
        @keyframes breathe {
            0% { transform: scale(0.95) rotateX(8deg) rotateY(-8deg); }
            100% { transform: scale(1.05) rotateX(-8deg) rotateY(8deg); }
        }

        #label {
            position: absolute;
            bottom: 40px;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 11px;
            letter-spacing: 8px;
            text-transform: uppercase;
            opacity: 0.5;
            pointer-events: none;
            font-weight: 300;
        }
    </style>
</head>
<body>
    <div id="scene-container">
        <svg id="canvas" viewBox="-500 -500 1000 1000"></svg>
        <div id="label">Maurer Rose Geometry</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const numRoses = 24;
        const paths = [];

        // Initialize SVG paths
        for(let i=0; i<numRoses; i++) {
            const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
            path.setAttribute("fill", "none");
            // Thinner strokes for inner elements, slightly thicker for outer
            const strokeW = 0.5 + (i / numRoses) * 1.5; 
            path.setAttribute("stroke-width", strokeW.toString());
            path.setAttribute("style", "mix-blend-mode: screen;");
            canvas.appendChild(path);
            paths.push(path);
        }

        let time = 0;

        function animate() {
            time += 0.0015; // Speed of morphing
            
            for(let p=0; p<numRoses; p++) {
                // Shift parameters for each layer to create 3D depth / mesh effect
                const layerOffset = p * 0.035;
                const t = time + layerOffset;
                
                // Morphing n and d parameters of the Maurer Rose equation
                const n = Math.sin(t * 0.8) * 5 + 7;  // Petal morphing
                const d = Math.cos(t * 0.5) * 15 + 29; // Angular morphing
                
                const scale = 450 - p * 12; 
                
                let dStr = "";
                
                // Calculate the geometry curve
                for (let i = 0; i <= 360; i += 1) { 
                    const k = i * d * Math.PI / 180;
                    const r = scale * Math.sin(n * k);
                    
                    // Base coordinates
                    const baseX = r * Math.cos(k);
                    const baseY = r * Math.sin(k);
                    
                    // Apply continuous rotation to the whole shape
                    const rot = t * 1.5;
                    const x = baseX * Math.cos(rot) - baseY * Math.sin(rot);
                    const y = baseX * Math.sin(rot) + baseY * Math.cos(rot);
                    
                    if (i === 0) {
                        dStr += `M ${x.toFixed(2)} ${y.toFixed(2)} `;
                    } else {
                        dStr += `L ${x.toFixed(2)} ${y.toFixed(2)} `;
                    }
                }
                
                paths[p].setAttribute("d", dStr);
                
                // Color morphing 
                const hue = (time * 80 + p * 8) % 360;
                const lightness = 60 + Math.sin(time * 4 + p) * 15;
                const opacity = 0.1 + (p / numRoses) * 0.4;
                
                paths[p].setAttribute("stroke", `hsla(${hue}, 85%, ${lightness}%, ${opacity})`);
            }
            
            requestAnimationFrame(animate);
        }
        
        animate();
    </script>
</body>
</html>
